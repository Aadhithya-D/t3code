# Personal fork workflow: when Adithya-Sakaray/t3code publishes a personal
# release (macOS), build an unsigned Windows NSIS installer on GitHub-hosted
# runners and publish it to THIS fork's GitHub Releases.
#
# Why this exists: upstream Release/CI jobs use private Blacksmith runners and
# org-only secrets, so they never start on personal forks. Adithya's fork ships
# macOS; this workflow ships Windows for the same personal version tags.
#
# Triggers:
#   1. Hourly poll of Adithya-Sakaray/t3code releases (skips if we already
#      published that tag)
#   2. Actions → "Personal Windows Release" → Run workflow
#   3. repository_dispatch type `upstream-personal-release` (optional hook from
#      the macOS repo: client_payload.tag = "personal-v0.0.32-adi.5")
#
# In-app updates:
#   Builds bake T3CODE_DESKTOP_UPDATE_REPOSITORY=$GITHUB_REPOSITORY into the app, so
#   the Windows build checks THIS fork's releases. Releases MUST be full
#   (non-prerelease) + latest so electron-updater's /releases/latest works.
name: Personal Windows Release

on:
  schedule:
    # Check upstream about once an hour for a new personal release.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag from Adithya-Sakaray/t3code (empty = latest)"
        required: false
        type: string
      version:
        description: "Override release version (empty = derive from upstream tag)"
        required: false
        type: string
      arch:
        description: "Windows architecture to build"
        required: false
        default: x64
        type: choice
        options:
          - x64
      product_name:
        description: "Desktop product name (side-by-side with official app)"
        required: false
        default: T3 Code Adi
        type: string
      app_id:
        description: "App id (must differ from official com.t3tools.t3code)"
        required: false
        default: com.t3tools.t3code.adi
        type: string
      force:
        description: "Rebuild even if this fork already has the tag"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [upstream-personal-release]

permissions:
  contents: write

env:
  UPSTREAM_REPO: Adithya-Sakaray/t3code

jobs:
  resolve:
    name: Resolve upstream release
    if: github.repository_owner != 'pingdotgg'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.meta.outputs.should_build }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      upstream_ref: ${{ steps.meta.outputs.upstream_ref }}
      arch: ${{ steps.meta.outputs.arch }}
      product_name: ${{ steps.meta.outputs.product_name }}
      app_id: ${{ steps.meta.outputs.app_id }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - id: meta
        name: Pick upstream tag and skip if already published
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
          INPUT_PRODUCT_NAME: ${{ github.event.inputs.product_name }}
          INPUT_APP_ID: ${{ github.event.inputs.app_id }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail

          upstream_tag="${INPUT_UPSTREAM_TAG:-}"
          if [[ -z "${upstream_tag}" && -n "${DISPATCH_TAG:-}" ]]; then
            upstream_tag="${DISPATCH_TAG}"
          fi

          if [[ -z "${upstream_tag}" ]]; then
            upstream_tag="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName --jq .tagName)"
          fi

          if [[ -z "${upstream_tag}" ]]; then
            echo "Could not resolve an upstream release tag from ${UPSTREAM_REPO}." >&2
            exit 1
          fi

          release_json="$(gh release view "${upstream_tag}" --repo "${UPSTREAM_REPO}" --json tagName,targetCommitish,name)"
          upstream_ref="$(jq -r '.targetCommitish' <<<"${release_json}")"
          if [[ -z "${upstream_ref}" || "${upstream_ref}" == "null" ]]; then
            upstream_ref="${upstream_tag}"
          fi

          version="${INPUT_VERSION:-}"
          if [[ -z "${version}" ]]; then
            version="${upstream_tag}"
            version="${version#personal-v}"
            version="${version#v}"
          fi
          version="${version#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Invalid version '${version}' from tag '${upstream_tag}'." >&2
            exit 1
          fi

          tag="personal-v${version}"
          arch="${INPUT_ARCH:-x64}"
          product_name="${INPUT_PRODUCT_NAME:-T3 Code Adi}"
          app_id="${INPUT_APP_ID:-com.t3tools.t3code.adi}"
          force="${INPUT_FORCE:-false}"

          should_build=true
          if [[ "${force}" != "true" ]] && gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists on ${GITHUB_REPOSITORY}; skipping."
            should_build=false
          fi

          {
            echo "should_build=${should_build}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "upstream_ref=${upstream_ref}"
            echo "arch=${arch}"
            echo "product_name=${product_name}"
            echo "app_id=${app_id}"
            echo "release_name=${product_name} ${version} (win-${arch})"
          } >> "${GITHUB_OUTPUT}"

          echo "Upstream: ${UPSTREAM_REPO}@${upstream_tag} (ref ${upstream_ref})"
          echo "Will publish: ${GITHUB_REPOSITORY} ${tag} (should_build=${should_build})"

  # node-pty publishes no Linux prebuild; the WSL backend needs a Linux pty.node
  # shipped inside the Windows installer (same approach as upstream release.yml).
  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [resolve]
    if: ${{ needs.resolve.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout upstream release commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.upstream_ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build_and_release:
    name: Build Windows NSIS + publish release
    needs: [resolve, build_wsl_node_pty]
    if: ${{ needs.resolve.outputs.should_build == 'true' && needs.build_wsl_node_pty.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout upstream release commit
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.upstream_ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          if (-not $installPath) {
            Write-Error "Visual Studio installation not found."
            exit 1
          }
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build unsigned Windows NSIS
        shell: bash
        env:
          T3CODE_DESKTOP_APP_ID: ${{ needs.resolve.outputs.app_id }}
          T3CODE_DESKTOP_PRODUCT_NAME: ${{ needs.resolve.outputs.product_name }}
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch "${{ needs.resolve.outputs.arch }}" \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          copied=0
          for pattern in \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
              copied=$((copied + 1))
            done
          done
          if [[ "${copied}" -eq 0 ]]; then
            echo "No desktop artifacts found under release/" >&2
            ls -la release || true
            exit 1
          fi
          ls -lah release-publish

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          # Tag is created on THIS repo; point it at the default branch tip.
          # The built sources came from upstream_ref (logged in the body).
          target_commitish: ${{ github.sha }}
          name: ${{ needs.resolve.outputs.release_name }}
          body: |
            Personal unsigned Windows build of `${{ env.UPSTREAM_REPO }}@${{ needs.resolve.outputs.upstream_ref }}`.

            - Product: `${{ needs.resolve.outputs.product_name }}`
            - App id: `${{ needs.resolve.outputs.app_id }}`
            - Arch: `win-${{ needs.resolve.outputs.arch }}`
            - Upstream tag: `${{ needs.resolve.outputs.tag }}`

            Windows SmartScreen may warn on unsigned builds — choose "More info" → "Run anyway".

            After the first install, later personal builds appear as in-app updates
            (this release is a full "latest" so electron-updater can find it).
          prerelease: false
          make_latest: true
          files: |
            release-publish/*.exe
            release-publish/*.blockmap
            release-publish/*.yml
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
